services:
  differential-privacy:
    # NOTE: prefer pinning by immutable digest for TEE reproducibility/attestation, e.g.
    #   image: ghcr.io/kailash-reddy/differential-privacy@sha256:<digest>
    # A mutable tag like :v1 can be repushed and breaks the TEE trust model.
    image: ghcr.io/kailash-reddy/differential-privacy:v1
    volumes:
      - /tmp/tee_input/data:/app/data
      - /tmp/tee_input/config:/app/config
      - /tmp/tee_output:/app/output
