services:
  skald-image:
    # `latest` moves automatically: merging a version bump in
    # datakaveri/Image-deidentification publishes :vX.Y.Z and points :latest at it
    # once its tests pass. It only ever moves to a newer version.
    # Pin by immutable digest when a release needs to be reproducible:
    #   image: ghcr.io/datakaveri/skald-image@sha256:<digest>
    image: ghcr.io/datakaveri/skald-image:latest
    volumes:
      - /tmp/tee_input/data:/app/data
      - /tmp/tee_input/config:/app/config
      - /tmp/tee_output:/app/output
