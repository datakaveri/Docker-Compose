services:
  skald-anonymisation:
    # NOTE: prefer pinning by immutable digest for TEE reproducibility/attestation, e.g.
    #   image: ghcr.io/datakaveri/skald@sha256:<digest>
    # A mutable tag like :latest can be repushed and breaks the TEE trust model.
    image: ghcr.io/datakaveri/skald:latest
    # SKALD 4.x images default to uid 65532 (nonroot). The enclave stages
    # /tmp/tee_input as root with mode 600 (deploy_enclave.py runs under sudo)
    # and its folders belong to kanonTEE, mode 755, so as 65532 SKALD can't
    # write ./output/status.json, and as uid 1000 it can't read its input.
    # Run as root, as the pre-4.0 images did: the enclave's cleanup runs as
    # root too, and kanonTEE can read the 644 outputs. /app/keys is a tmpfs, so
    # key material stays in memory and never reaches the container's disk.
    user: "0:0"
    tmpfs:
      - /app/keys:mode=0700
    volumes:
      - /tmp/tee_input/data:/app/data
      - /tmp/tee_input/config:/app/config
      - /tmp/tee_output:/app/output
