services:
  skald-anonymisation:
    # NOTE: prefer pinning by immutable digest for TEE reproducibility/attestation, e.g.
    #   image: ghcr.io/datakaveri/skald@sha256:<digest>
    # A mutable tag like :latest can be repushed and breaks the TEE trust model.
    image: ghcr.io/datakaveri/skald:latest
    volumes:
      - /tmp/tee_input/data:/app/data
      - /tmp/tee_input/config:/app/config
      - /tmp/tee_output:/app/output
